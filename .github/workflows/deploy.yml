# Builds the app and publishes it to GitHub Pages on every push to main.
#
# Pages can only serve "/" or "/docs" when you deploy straight from a
# branch, which is why the site is published from a workflow instead: it
# runs the real build and uploads dist/ whatever it is called. It also
# means dist/app.js can never go stale — pushing a change to src/ is
# enough, there is nothing to remember to rebuild by hand.
#
# In the repository: Settings -> Pages -> Source -> GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true # turn Pages on if it is not enabled yet

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
